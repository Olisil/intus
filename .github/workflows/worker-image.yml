# Builds the Intus GPU worker image for one Spirula version and publishes it to GitHub Packages:
#   ghcr.io/olisil/intus-worker:spirula-<version>
# Start it by hand: Actions → Build Intus worker → Run workflow, and type the Spirula release tag.
name: Build Intus worker
on:
  workflow_dispatch:
    inputs:
      spirula_version:
        description: Spirula release tag, e.g. v2026.11.12 (worker/recipes/<tag>.json must exist)
        required: true
        default: v2026.11.12
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: A recipe for this version
        run: test -f "worker/recipes/${{ inputs.spirula_version }}.json" || { echo "::error::Add worker/recipes/${{ inputs.spirula_version }}.json first"; exit 1; }
      - name: Image name (lower case, as the registry requires)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/intus-worker:spirula-${{ inputs.spirula_version }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          build-args: SPIRULA_VERSION=${{ inputs.spirula_version }}
          push: true
          tags: ${{ env.IMAGE }}
